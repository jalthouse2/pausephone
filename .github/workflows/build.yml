name: Build app

# Builds the Android app on every push to main and puts it at
# https://github.com/jalthouse2/pausephone/releases/latest/download/pausephone.apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Publish to the download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk pausephone.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest pausephone.apk \
            --title "[pause]phone — latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Open this page on your Android phone and tap pausephone.apk to install."
